<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calorie Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen">
  <main class="max-w-6xl mx-auto px-4 py-8">
    <header class="mb-8">
      <h1 class="text-3xl md:text-4xl font-bold">Calorie Tracker</h1>
      <p class="text-slate-600 mt-2">Log meals, track calories and macros, and stay on target each day.</p>
    </header>

    <section class="grid md:grid-cols-3 gap-4 mb-8" id="summaryCards"></section>

    <section class="grid lg:grid-cols-2 gap-8">
      <div class="bg-white rounded-xl shadow-sm p-6 border border-slate-200">
        <h2 class="text-xl font-semibold mb-4">Daily Goal</h2>
        <form id="goalForm" class="space-y-4">
          <div>
            <label for="dailyGoal" class="block text-sm font-medium mb-1">Calories per day</label>
            <input id="dailyGoal" type="number" min="0" step="1" class="w-full rounded-lg border-slate-300 focus:border-indigo-500 focus:ring-indigo-500" placeholder="e.g. 2200" required />
          </div>
          <button type="submit" class="w-full bg-indigo-600 text-white py-2.5 rounded-lg hover:bg-indigo-700 transition">Save Goal</button>
        </form>

        <div class="mt-6">
          <h3 class="font-semibold mb-2">Progress</h3>
          <div class="w-full bg-slate-200 rounded-full h-4 overflow-hidden">
            <div id="progressBar" class="h-full bg-emerald-500 transition-all duration-300" style="width: 0%"></div>
          </div>
          <p id="progressText" class="text-sm text-slate-600 mt-2">0% of goal reached</p>
        </div>
      </div>

      <div class="bg-white rounded-xl shadow-sm p-6 border border-slate-200">
        <h2 class="text-xl font-semibold mb-4">Add Meal</h2>
        <form id="mealForm" class="grid grid-cols-2 gap-4">
          <div class="col-span-2">
            <label for="mealName" class="block text-sm font-medium mb-1">Meal name</label>
            <input id="mealName" type="text" class="w-full rounded-lg border-slate-300 focus:border-indigo-500 focus:ring-indigo-500" placeholder="Chicken salad" required />
          </div>
          <div>
            <label for="mealCalories" class="block text-sm font-medium mb-1">Calories</label>
            <input id="mealCalories" type="number" min="0" step="1" class="w-full rounded-lg border-slate-300 focus:border-indigo-500 focus:ring-indigo-500" required />
          </div>
          <div>
            <label for="mealProtein" class="block text-sm font-medium mb-1">Protein (g)</label>
            <input id="mealProtein" type="number" min="0" step="0.1" class="w-full rounded-lg border-slate-300 focus:border-indigo-500 focus:ring-indigo-500" value="0" />
          </div>
          <div>
            <label for="mealCarbs" class="block text-sm font-medium mb-1">Carbs (g)</label>
            <input id="mealCarbs" type="number" min="0" step="0.1" class="w-full rounded-lg border-slate-300 focus:border-indigo-500 focus:ring-indigo-500" value="0" />
          </div>
          <div>
            <label for="mealFat" class="block text-sm font-medium mb-1">Fat (g)</label>
            <input id="mealFat" type="number" min="0" step="0.1" class="w-full rounded-lg border-slate-300 focus:border-indigo-500 focus:ring-indigo-500" value="0" />
          </div>
          <button type="submit" class="col-span-2 bg-emerald-600 text-white py-2.5 rounded-lg hover:bg-emerald-700 transition">Add Meal</button>
        </form>
      </div>
    </section>

    <section class="mt-8 bg-white rounded-xl shadow-sm p-6 border border-slate-200">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-xl font-semibold">Meal Log</h2>
        <button id="clearAll" class="text-sm text-red-600 hover:text-red-700">Clear all</button>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead>
            <tr class="text-left border-b">
              <th class="py-2 pr-4">Meal</th>
              <th class="py-2 pr-4">Calories</th>
              <th class="py-2 pr-4">Protein</th>
              <th class="py-2 pr-4">Carbs</th>
              <th class="py-2 pr-4">Fat</th>
              <th class="py-2 pr-4">Action</th>
            </tr>
          </thead>
          <tbody id="mealTableBody"></tbody>
        </table>
      </div>
      <p id="emptyState" class="text-slate-500 py-6">No meals logged yet. Add your first meal above.</p>
    </section>
  </main>

  <script>
    const STORAGE_KEY = 'calorie_tracker_data_v1';

    const state = {
      goal: 2000,
      meals: []
    };

    const goalForm = document.getElementById('goalForm');
    const mealForm = document.getElementById('mealForm');
    const dailyGoalInput = document.getElementById('dailyGoal');
    const mealTableBody = document.getElementById('mealTableBody');
    const emptyState = document.getElementById('emptyState');
    const clearAllBtn = document.getElementById('clearAll');
    const summaryCards = document.getElementById('summaryCards');
    const progressBar = document.getElementById('progressBar');
    const progressText = document.getElementById('progressText');

    function loadState() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (!saved) return;
      try {
        const parsed = JSON.parse(saved);
        if (typeof parsed.goal === 'number' && parsed.goal > 0) {
          state.goal = parsed.goal;
        }
        if (Array.isArray(parsed.meals)) {
          state.meals = parsed.meals;
        }
      } catch {
        localStorage.removeItem(STORAGE_KEY);
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function totals() {
      return state.meals.reduce((acc, meal) => {
        acc.calories += Number(meal.calories) || 0;
        acc.protein += Number(meal.protein) || 0;
        acc.carbs += Number(meal.carbs) || 0;
        acc.fat += Number(meal.fat) || 0;
        return acc;
      }, { calories: 0, protein: 0, carbs: 0, fat: 0 });
    }

    function card(title, value, subtitle) {
      return `
        <article class="bg-white rounded-xl border border-slate-200 p-4 shadow-sm">
          <p class="text-sm text-slate-500">${title}</p>
          <p class="text-2xl font-bold mt-1">${value}</p>
          <p class="text-xs text-slate-500 mt-1">${subtitle}</p>
        </article>
      `;
    }

    function renderSummary() {
      const { calories, protein, carbs, fat } = totals();
      const remaining = Math.max(state.goal - calories, 0);
      summaryCards.innerHTML =
        card('Calories eaten', `${calories.toFixed(0)} kcal`, 'Today') +
        card('Calories remaining', `${remaining.toFixed(0)} kcal`, `Goal: ${state.goal} kcal`) +
        card('Macros', `P ${protein.toFixed(1)}g · C ${carbs.toFixed(1)}g · F ${fat.toFixed(1)}g`, 'Protein · Carbs · Fat');

      const progress = state.goal > 0 ? Math.min((calories / state.goal) * 100, 100) : 0;
      progressBar.style.width = `${progress}%`;
      progressBar.className = `h-full transition-all duration-300 ${progress > 100 ? 'bg-red-500' : progress >= 80 ? 'bg-amber-500' : 'bg-emerald-500'}`;
      progressText.textContent = `${(state.goal > 0 ? (calories / state.goal) * 100 : 0).toFixed(1)}% of goal reached`;
    }

    function renderMeals() {
      mealTableBody.innerHTML = state.meals.map((meal, index) => `
        <tr class="border-b last:border-none">
          <td class="py-2 pr-4 font-medium">${meal.name}</td>
          <td class="py-2 pr-4">${Number(meal.calories).toFixed(0)} kcal</td>
          <td class="py-2 pr-4">${Number(meal.protein).toFixed(1)} g</td>
          <td class="py-2 pr-4">${Number(meal.carbs).toFixed(1)} g</td>
          <td class="py-2 pr-4">${Number(meal.fat).toFixed(1)} g</td>
          <td class="py-2 pr-4">
            <button type="button" data-index="${index}" class="text-red-600 hover:text-red-700">Delete</button>
          </td>
        </tr>
      `).join('');

      emptyState.style.display = state.meals.length ? 'none' : 'block';

      mealTableBody.querySelectorAll('button[data-index]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const index = Number(btn.dataset.index);
          state.meals.splice(index, 1);
          saveState();
          render();
        });
      });
    }

    function render() {
      dailyGoalInput.value = state.goal;
      renderSummary();
      renderMeals();
    }

    goalForm.addEventListener('submit', (event) => {
      event.preventDefault();
      const goal = Number(dailyGoalInput.value);
      if (!Number.isFinite(goal) || goal <= 0) return;
      state.goal = goal;
      saveState();
      render();
    });

    mealForm.addEventListener('submit', (event) => {
      event.preventDefault();
      const meal = {
        name: document.getElementById('mealName').value.trim(),
        calories: Number(document.getElementById('mealCalories').value),
        protein: Number(document.getElementById('mealProtein').value || 0),
        carbs: Number(document.getElementById('mealCarbs').value || 0),
        fat: Number(document.getElementById('mealFat').value || 0)
      };

      if (!meal.name || !Number.isFinite(meal.calories) || meal.calories < 0) return;

      state.meals.unshift(meal);
      saveState();
      mealForm.reset();
      document.getElementById('mealProtein').value = 0;
      document.getElementById('mealCarbs').value = 0;
      document.getElementById('mealFat').value = 0;
      render();
    });

    clearAllBtn.addEventListener('click', () => {
      state.meals = [];
      saveState();
      render();
    });

    loadState();
    render();
  </script>
</body>
</html>
